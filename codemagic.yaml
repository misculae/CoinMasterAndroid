
workflows:
  android-workflow:
    name: Coin Master Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Repair Android SDK Build Tools
        script: |
          yes | sdkmanager --licenses
          rm -rf "$ANDROID_SDK_ROOT/build-tools/34.0.0"
          sdkmanager --install "build-tools;34.0.0"

      - name: Build Android APK
        script: |
          cd CoinMasterAndroid
          gradle :app:assembleDebug

    artifacts:
      - CoinMasterAndroid/app/build/outputs/apk/debug/*.apk
