
workflows:
  android-workflow:
    name: Coin Master Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Check Android SDK
        script: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -10

      - name: Build Android APK
        script: |
          cd CoinMasterAndroid
          gradle :app:assembleDebug
    artifacts:
      - CoinMasterAndroid/app/build/outputs/apk/debug/*.apk
